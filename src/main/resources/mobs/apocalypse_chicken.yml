# CHICKEN APOCALYPSE · a humble chicken turned menace — and a living showcase of the VARIANT system.
# Each spawn rolls one of the mutations below (weighted, gated by biome/time/weather). Try it with
# /am variant apocalypse_chicken fiery  (or frost / thunder / kamikaze / royal ...).
id: apocalypse_chicken
name: "<white>Apocalypse Chicken</white>"
lore: ["<gray>It has seen things. It has plans."]
type: CHICKEN
tier: COMMON
category: chicken
tags: [chicken, farm, swarm]

stats:
  health: 10
  damage: 3
  speed: 0.4
  follow-range: 32

ai:
  aggression: AGGRESSIVE
  movement: CHASE
  aggro-range: 32

traits:
  - { trait: hunter, drive: true, drive-power: 0.34, reach: 2.2 }
  - { trait: pack, radius: 8, per: 0.34, max-amplifier: 2 }

skills:
  - skill: strike
    label: "Peck"
    trigger: { types: [TICK], cooldown: 1s, max-range: 2.2, target: TARGET }
    params: { damage: 3, knockback: 0.2 }

drops:
  xp: 2-5
  items:
    - { material: FEATHER, amount: 1-2, chance: 0.6 }
    - { material: EGG, amount: 1-2, chance: 0.4 }

# --- the mutation tree --------------------------------------------------------------------------
variant-base-weight: 2.0
variants:
  - id: fiery
    weight: 1.5
    name-prefix: "<red>Fiery"
    health-mul: 1.2
    damage-mul: 1.2
    glow: true
    glow-color: RED
    ambient-particle: flame
    tags: [fire]
    conditions: { biomes-allow: [desert, badlands, savanna] }
    skills:
      - { skill: ignite, trigger: { types: [ON_ATTACK], cooldown: 1s, target: TARGET }, params: { fire-ticks: 60 } }
    drops:
      - { material: BLAZE_POWDER, amount: 1, chance: 0.3 }
  - id: frost
    weight: 1.5
    name-prefix: "<aqua>Frost"
    glow: true
    glow-color: AQUA
    ambient-particle: snowflake
    tags: [ice]
    conditions: { biomes-allow: [snowy_plains, snowy_taiga, ice_spikes, frozen_peaks, grove] }
    skills:
      - { skill: slow, trigger: { types: [ON_ATTACK], cooldown: 2s, target: TARGET, duration: 4s }, params: { effects: [ { type: slowness, amplifier: 1 } ] } }
  - id: thunder
    weight: 1.0
    name-prefix: "<yellow>Thunder"
    glow: true
    glow-color: YELLOW
    ambient-particle: electric_spark
    conditions: { weather: THUNDER }
    skills:
      - { skill: thunder, trigger: { types: [TICK], cooldown: 6s, target: NEAREST_PLAYER, max-range: 20, chance: 0.5 }, params: { damage: 2 } }
  - id: kamikaze
    weight: 1.0
    name-prefix: "<gold>Kamikaze"
    health-mul: 0.8
    speed-mul: 1.2
    glow: true
    glow-color: YELLOW
    traits:
      - { trait: exploder, radius: 3, damage: 6, knockback: 0.8, fire: false }
  - id: tank
    weight: 0.8
    name-prefix: "<gray>Tank"
    tier: UNCOMMON
    health-mul: 3.0
    armor-mul: 3.0
    speed-mul: 0.7
  - id: vampire
    weight: 0.7
    name-prefix: "<dark_red>Vampire"
    tier: UNCOMMON
    conditions: { time-min: 13000, time-max: 23000 }
    traits:
      - { trait: vampire, heal: 2 }
  - id: corrupted
    weight: 0.5
    name-prefix: "<dark_purple>Corrupted"
    tier: RARE
    damage-mul: 1.3
    glow: true
    glow-color: DARK_PURPLE
    ambient-particle: portal
    traits:
      - { trait: hexer, radius: 5, cooldown: 5s }
  - id: royal
    weight: 0.15
    name: "<gradient:#ffd700:#fff3b0><bold>Royal Chicken</bold></gradient>"
    tier: ELITE
    health-mul: 6.0
    damage-mul: 1.6
    glow: true
    glow-color: YELLOW
    drops:
      - { material: GOLD_INGOT, amount: 2-5, chance: 1.0 }
      - { material: GOLDEN_APPLE, amount: 1, chance: 0.5 }

scaling:
  health-per-player: 0.06
  damage-per-player: 0.04
  max-players: 8
