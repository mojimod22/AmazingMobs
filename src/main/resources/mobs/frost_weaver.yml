# Archetype: CONTROL MAGE — roots, slows and blinds; locks players down for allies.
# Tactical role: pure crowd control. Synergy: devastating with brutes/assassins that follow up.
id: frost_weaver
name: "<gradient:#4fc3f7:#b3e5fc>Frost Weaver</gradient>"
lore:
  - "<aqua>It weaves the cold into chains."
type: STRAY
tier: ELITE
category: control
tags: [ice, caster, control]

stats:
  health: 70
  damage: 4
  speed: 0.26
  armor: 4
  follow-range: 44
  damage-multipliers:
    fire: 1.5      # ice creatures fear fire
    projectile: 1.1

equipment:
  main-hand: { material: BOW, enchants: { power: 1 }, drop-chance: 0.04 }

ai:
  aggression: AGGRESSIVE
  movement: KITE
  target-priority: [NEAREST]
  aggro-range: 44
  kite-distance: 12

skills:
  - skill: trap
    label: "Glacial Bind"
    trigger:
      types: [TICK]
      cooldown: 8s
      target: NEAREST_PLAYER
      max-range: 24
      radius: 1
      duration: 4s
      chance: 0.7
    params:
      material: COBWEB
      particle: snowflake
      sound: block_glass_break
  - skill: slow
    label: "Deep Chill"
    trigger:
      types: [TICK]
      cooldown: 5s
      target: ALL_PLAYERS_IN_RADIUS
      radius: 14
      duration: 5s
      chance: 0.6
    params:
      effects:
        - { type: slowness, amplifier: 2 }
        - { type: mining_fatigue, amplifier: 0 }
  - skill: blind
    label: "Whiteout"
    trigger:
      types: [ON_DAMAGED]
      cooldown: 12s
      target: NEAREST_PLAYER
      max-range: 16
      duration: 3s
      chance: 0.3

drops:
  xp: 26-48
  items:
    - { material: BLUE_ICE, amount: 1-3, chance: 0.5 }
    - { material: POWDER_SNOW_BUCKET, amount: 1, chance: 0.1 }

presentation:
  glow: true
  glow-color: AQUA
  ambient-particle: snowflake

scaling:
  health-per-player: 0.1
  damage-per-player: 0.02
  max-players: 8
