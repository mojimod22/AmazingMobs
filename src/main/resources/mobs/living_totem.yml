# STACK UNIT · a walking totem column: a sturdy base carrying a frost Core and a wither Crown.
# Cascading death: kill the base and the Core drops (keeps fighting) while the Crown falls with it.
# A readable "structure, not a single mob" — the whole point of the stacking system.
id: living_totem
name: "<gold><bold>Living Totem</bold></gold>"
lore:
  - "<gray>Three horrors, one terrible idol."
type: IRON_GOLEM
tier: MINIBOSS
category: totem
tags: [construct, frontline, totem]

stats:
  health: 200
  damage: 10
  speed: 0.24
  armor: 12
  armor-toughness: 4
  knockback-resistance: 0.9
  follow-range: 44
  scale: 1.1

ai:
  aggression: AGGRESSIVE
  movement: CHASE
  aggro-range: 44

riders:
  - { mob: totem_core, on-base-death: DROP, bonus: [resistance:0] }
  - { mob: totem_crown, on-base-death: KILL }

traits:
  - { trait: hunter, drive: true, drive-power: 0.22, reach: 3.0 }

skills:
  - skill: strike
    label: "Idol Smash"
    trigger: { types: [TICK], cooldown: 1s, max-range: 3.0, target: TARGET }
    params: { damage: 10, knockback: 0.6 }
  - skill: area_slam
    label: "Totem Quake"
    trigger: { types: [TICK], cooldown: 8s, warmup: 1s, max-range: 4, radius: 5, chance: 0.6 }
    params: { damage: 8, knockup: 0.6 }

drops:
  xp: 80-140
  items:
    - { material: IRON_BLOCK, amount: 2-4, chance: 0.7 }
    - { material: DIAMOND, amount: 1-3, chance: 0.5 }

presentation:
  boss-bar: true
  boss-bar-color: GREEN
  boss-bar-title: "<gold>Living Totem"

scaling:
  health-per-player: 0.16
  damage-per-player: 0.04
  max-players: 8
