# Archetype: SWARM LEADER — spits out spiderlings endlessly and webs you in place.
# Tactical role: overwhelm engine. Synergy: pair with single hard-hitters while you drown in adds.
id: broodmother
name: "<gradient:#4e342e:#8d6e63><bold>Broodmother</bold></gradient>"
lore:
  - "<color:#6d4c41>Her children are without number."
type: SPIDER
tier: MINIBOSS
category: swarm
tags: [arthropod, summoner, frontline]

stats:
  health: 150
  damage: 7
  speed: 0.28
  armor: 4
  follow-range: 42
  scale: 1.4
  damage-multipliers:
    fire: 1.3

ai:
  aggression: AGGRESSIVE
  movement: CHASE
  target-priority: [NEAREST]
  aggro-range: 42

skills:
  - skill: summon
    label: "Spawn Brood"
    trigger:
      types: [TICK]
      cooldown: 7s
      chance: 0.9
    params:
      mob: spiderling
      count: 3-5
      spread: 4
      sound: entity_spider_ambient
      particle: item_cobweb
  - skill: trap
    label: "Web Snare"
    trigger:
      types: [TICK]
      cooldown: 9s
      target: ALL_PLAYERS_IN_RADIUS
      radius: 2
      duration: 5s
      chance: 0.7
    params:
      material: COBWEB
  - skill: fear
    label: "Skittering Dread"
    trigger:
      types: [ON_LOW_HEALTH]
      max-health-pct: 0.4
      target: ALL_PLAYERS_IN_RADIUS
      radius: 12
      duration: 5s

drops:
  xp: 55-100
  items:
    - { material: STRING, amount: 4-9, chance: 0.9 }
    - { material: FERMENTED_SPIDER_EYE, amount: 1-2, chance: 0.4 }
    - { material: COBWEB, amount: 2-5, chance: 0.5 }

presentation:
  glow: false
  boss-bar: true
  boss-bar-color: RED
  boss-bar-title: "<dark_red>Broodmother"
  ambient-particle: item_cobweb

scaling:
  health-per-player: 0.16
  damage-per-player: 0.04
  max-players: 8
