# BAT ECLIPSE · a night-locked swarm of orbiting bats — screamers, leeches, hexers, stormbringers.
id: bat_eclipse
name: "<dark_gray><bold>Bat Eclipse</bold></dark_gray>"
description: "The sky goes black with wings."
difficulty: 1.3
duration: 8m
cooldown: 22m

area: { shape: SPHERE, radius: 60, dynamic: true }
spawn: { max-per-tick: 10, max-mobs: 80, min-player-distance: 10, attempts: 26 }
activation: { min-players: 1, max-players: 10, time-min: 13000, time-max: 23000 }

start-title: "<dark_gray><bold>Bat Eclipse</bold></dark_gray>"
start-subtitle: "<gray>They came with the dark</gray>"
sound: entity_bat_takeoff

waves:
  - label: "First Flight"
    start-delay: 3s
    clear-threshold: 0.85
    mobs:
      - { mob: swarm_bat, count: 8-12, per-player: 4 }
      - { mob: echo_bat, count: 4-6, per-player: 2 }
      - { mob: blood_bat, count: 2-4, per-player: 1 }
  - label: "The Swarm"
    start-delay: 4s
    clear-threshold: 0.85
    mobs:
      - { mob: swarm_bat, count: 8-10, per-player: 3 }
      - { mob: hex_bat, count: 3-5, per-player: 1 }
      - { mob: bomber_bat, count: 2-3, per-player: 1 }
      - { mob: storm_bat, count: 2-3, per-player: 1, role: elite }
  - label: "The Broodmother"
    start-delay: 5s
    clear-threshold: 1.0
    title: "<dark_purple>The Bat Broodmother descends</dark_purple>"
    sound: entity_bat_death
    mobs:
      - { mob: bat_broodmother, count: 1, role: boss, boss: true }
      - { mob: bomber_bat, count: 2-3, per-player: 1 }

rewards:
  xp: 150-280
  message: "<green>The eclipse passes. The sky clears."
  items:
    - { material: PHANTOM_MEMBRANE, amount: 2-4, chance: 0.6 }
    - { material: COPPER_INGOT, amount: 4-8, chance: 0.6 }

end-message: "<green><bold>Bat Eclipse weathered!</bold>"
fail-message: "<red>Swarmed in the dark..."
