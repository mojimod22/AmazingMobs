# FARM APOCALYPSE · the livestock rise up — cows, then the flock, then the Chicken King.
# Uses the adaptive DIRECTOR: clears fast and it ramps up; struggle and it eases off.
id: farm_apocalypse
name: "<color:#8d6e63><bold>Farm Apocalypse</bold></color>"
description: "Never eat another steak again."
difficulty: 1.2
duration: 10m
cooldown: 25m

director:
  enabled: true
  min-multiplier: 0.7
  max-multiplier: 1.9
  step: 0.15
  target-clear-seconds: 40

area: { shape: CYLINDER, radius: 65, height: 30, dynamic: true }
spawn: { max-per-tick: 12, max-mobs: 100, min-player-distance: 8, attempts: 24 }
activation: { min-players: 1, max-players: 10 }

start-title: "<color:#8d6e63><bold>FARM APOCALYPSE</bold></color>"
start-subtitle: "<gray>The animals remember</gray>"
sound: entity_cow_ambient

waves:
  - label: "Livestock Revolt"
    start-delay: 3s
    clear-threshold: 0.85
    mobs:
      - { mob: dire_cow, count: 6-8, per-player: 2 }
      - { mob: apocalypse_chicken, count: 8-12, per-player: 4 }
  - label: "The Flock"
    start-delay: 4s
    clear-threshold: 0.85
    mobs:
      - { mob: apocalypse_chicken, count: 12-16, per-player: 5 }
      - { mob: kamikaze_chicken, count: 2-4, per-player: 1 }
  - label: "The Chicken King"
    start-delay: 5s
    clear-threshold: 1.0
    title: "<gold><bold>The Chicken King descends</bold></gold>"
    sound: entity_chicken_hurt
    mobs:
      - { mob: chicken_king, count: 1, role: boss, boss: true }
      - { mob: apocalypse_chicken, count: 6-8, per-player: 2 }

rewards:
  xp: 200-380
  message: "<green>The farm is... mostly at peace again."
  items:
    - { material: GOLD_INGOT, amount: 3-6, chance: 0.7 }
    - { material: EGG, amount: 16-32, chance: 0.8 }
    - { material: DIAMOND, amount: 1-3, chance: 0.5 }

end-message: "<green><bold>Farm Apocalypse survived!</bold>"
fail-message: "<red>Pecked to death. How embarrassing."
