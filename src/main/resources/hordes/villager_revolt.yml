# VILLAGER REVOLT · the village rises — zealots, disguised marauders, led by an Iron Warlord.
id: villager_revolt
name: "<color:#a1887f><bold>Villager Revolt</bold></color>"
description: "No more trades. Only torches and pitchforks."
difficulty: 1.35
duration: 9m
cooldown: 24m

director:
  enabled: true
  min-multiplier: 0.7
  max-multiplier: 1.7
  step: 0.12
  target-clear-seconds: 45

area: { shape: CYLINDER, radius: 70, height: 30, dynamic: true }
spawn: { max-per-tick: 8, max-mobs: 70, min-player-distance: 12, attempts: 26 }
activation: { min-players: 1, max-players: 10 }

start-title: "<color:#a1887f><bold>Villager Revolt</bold></color>"
start-subtitle: "<gray>The market is closed</gray>"
sound: event_raid_horn

waves:
  - label: "The Mob Gathers"
    start-delay: 3s
    mobs:
      - { mob: villager_zealot, count: 5-7, per-player: 2 }
  - label: "Hidden Blades"
    start-delay: 5s
    mobs:
      - { mob: illusion_villager, count: 3-4, per-player: 1, role: elite }
      - { mob: villager_zealot, count: 4-6, per-player: 2 }
  - label: "The Chosen One"
    start-delay: 5s
    clear-threshold: 1.0
    title: "<white>Their champion ascends...</white>"
    subtitle: "<yellow>a Villager Saiyan awakens</yellow>"
    mobs:
      - { mob: villager_saiyan, count: 1, role: boss, boss: true }
      - { mob: iron_warlord, count: 1, per-player: 1, role: elite }
      - { mob: villager_zealot, count: 4-6, per-player: 2 }

rewards:
  xp: 180-330
  message: "<green>The revolt is quelled. Trade resumes... uneasily."
  items:
    - { material: EMERALD, amount: 4-8, chance: 0.8 }
    - { material: DIAMOND, amount: 1-3, chance: 0.5 }

end-message: "<green><bold>Villager Revolt put down!</bold>"
fail-message: "<red>The village is theirs now."
